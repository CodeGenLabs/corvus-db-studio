name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Huỷ lần chạy cũ khi push tiếp vào cùng PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint · typecheck · test · contract · build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Thứ tự này là có chủ đích: cái nào rẻ và bắt lỗi sớm thì chạy trước.
      - name: Lint (eslint + 3 rule kiến trúc Corvus)
        run: pnpm exec eslint .

      - name: Layer boundaries (dependency-cruiser)
        run: pnpm exec depcruise packages apps

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Contract integrity (rpc-contract.md §3 · ADR-0010)
        run: pnpm check:contract

      - name: Build
        run: pnpm build
