services:
  corvus-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: corvus-db-studio:latest
    container_name: corvus-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORVUS_MASTER_KEY=change_me_to_a_secure_random_64_character_hex_string
    volumes:
      - corvus_data:/app/data

volumes:
  corvus_data:
    driver: local
