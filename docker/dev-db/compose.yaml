name: corvus-dev-db

services:
  postgres:
    image: postgres:16-alpine
    container_name: corvus-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_DB_POSTGRES_DATABASE:-corvus_dev}
      POSTGRES_USER: ${DEV_DB_POSTGRES_USER:-corvus}
      POSTGRES_PASSWORD: ${DEV_DB_POSTGRES_PASSWORD:-corvus_dev_pw}
    ports:
      - "127.0.0.1:${DEV_DB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - corvus_dev_postgres_data:/var/lib/postgresql/data
      - ./seed/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  mysql:
    image: mysql:8.0
    container_name: corvus-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DEV_DB_MYSQL_DATABASE:-corvus_dev}
      MYSQL_USER: ${DEV_DB_MYSQL_USER:-corvus}
      MYSQL_PASSWORD: ${DEV_DB_MYSQL_PASSWORD:-corvus_dev_pw}
      MYSQL_ROOT_PASSWORD: ${DEV_DB_MYSQL_ROOT_PASSWORD:-corvus_dev_root_pw}
    ports:
      - "127.0.0.1:${DEV_DB_MYSQL_PORT:-3306}:3306"
    volumes:
      - corvus_dev_mysql_data:/var/lib/mysql
      - ./seed/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $${MYSQL_USER} -p$${MYSQL_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mariadb:
    image: mariadb:11.4
    container_name: corvus-dev-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DEV_DB_MARIADB_DATABASE:-corvus_dev}
      MARIADB_USER: ${DEV_DB_MARIADB_USER:-corvus}
      MARIADB_PASSWORD: ${DEV_DB_MARIADB_PASSWORD:-corvus_dev_pw}
      MARIADB_ROOT_PASSWORD: ${DEV_DB_MARIADB_ROOT_PASSWORD:-corvus_dev_root_pw}
    ports:
      - "127.0.0.1:${DEV_DB_MARIADB_PORT:-3307}:3306"
    volumes:
      - corvus_dev_mariadb_data:/var/lib/mysql
      - ./seed/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u $${MARIADB_USER} -p$${MARIADB_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: corvus-dev-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DEV_DB_MSSQL_PASSWORD:-Corvus_dev_pw1}
      MSSQL_PID: "Developer"
    ports:
      - "127.0.0.1:${DEV_DB_MSSQL_PORT:-1434}:1433"
    volumes:
      - corvus_dev_mssql_data:/var/opt/mssql
      - ./seed/mssql:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\") > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 25

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: corvus-dev-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${DEV_DB_ORACLE_SYS_PASSWORD:-corvus_dev_pw}
      APP_USER: ${DEV_DB_ORACLE_USER:-CORVUS_DEV}
      APP_USER_PASSWORD: ${DEV_DB_ORACLE_PASSWORD:-corvus_dev_pw}
      ORACLE_DATABASE: ${DEV_DB_ORACLE_DATABASE:-FREEPDB1}
    ports:
      - "127.0.0.1:${DEV_DB_ORACLE_PORT:-1521}:1521"
    volumes:
      - corvus_dev_oracle_data:/opt/oracle/oradata
      - ./seed/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30

  mongodb:
    image: mongo:7
    container_name: corvus-dev-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DEV_DB_MONGODB_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DEV_DB_MONGODB_ROOT_PASSWORD:-corvus_dev_pw}
      MONGO_INITDB_DATABASE: ${DEV_DB_MONGODB_DATABASE:-corvus_dev}
    ports:
      - "127.0.0.1:${DEV_DB_MONGODB_PORT:-27017}:27017"
    volumes:
      - corvus_dev_mongodb_data:/data/db
      - ./seed/mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: corvus-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${DEV_DB_REDIS_PASSWORD:-corvus_dev_pw}"]
    ports:
      - "127.0.0.1:${DEV_DB_REDIS_PORT:-6379}:6379"
    volumes:
      - corvus_dev_redis_data:/data
      - ./seed/redis:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${DEV_DB_REDIS_PASSWORD:-corvus_dev_pw} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  corvus_dev_postgres_data:
  corvus_dev_mysql_data:
  corvus_dev_mariadb_data:
  corvus_dev_mssql_data:
  corvus_dev_oracle_data:
  corvus_dev_mongodb_data:
  corvus_dev_redis_data:
